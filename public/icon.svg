<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1615" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050404" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6b3" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#9d7e36" />
      <stop offset="100%" stop-color="#e8d08c" />
    </linearGradient>
    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f171d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8f171d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="236.544" fill="url(#crimsonGlow)" />

  <!-- Outer Ring (Gold) -->
  <circle cx="256" cy="256" r="215.04" fill="none" stroke="url(#goldGrad)" stroke-width="11.264" />

  <!-- Inner Crimson Accent Ring -->
  <circle cx="256" cy="256" r="202.1376" fill="none" stroke="#8f171d" stroke-width="6.144" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="189.2352" fill="none" stroke="url(#goldGrad)" stroke-width="3.072" stroke-dasharray="7.68 5.12" />

  <!-- Center Monogram 'W' -->
  <text 
    x="256" 
    y="291.84000000000003" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
    font-size="184.32" 
    font-weight="700" 
    letter-spacing="-2"
    fill="url(#goldGrad)"
  >W</text>

  <!-- Subtitle Text -->
  <text 
    x="256" 
    y="378.88" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, sans-serif" 
    font-size="28.16" 
    font-weight="700" 
    letter-spacing="9.216" 
    fill="#eedbb3" 
    opacity="0.9"
  >WARHOLA</text>

  <text 
    x="256" 
    y="414.72" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, sans-serif" 
    font-size="20.48" 
    font-weight="600" 
    letter-spacing="11.264" 
    fill="#d9534f"
  >BLOODY GIN</text>
</svg>