.fams{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}.fm{background:var(--card);border:1px solid var(--line);padding:7px 12px;font-size:11.5px;display:flex;align-items:center;gap:7px}.fm i{width:9px;height:9px;border-radius:50%}.fm.on{border-color:var(--gold)}
.orb{width:110px;height:110px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;margin:16px auto;text-align:center;font-family:var(--serif);font-size:17px;color:var(--gold);padding:10px;cursor:pointer;transition:transform 4s ease-in-out,background 4s ease-in-out}.orb.in{transform:scale(1.35);background:var(--golds)}.orb.out{transform:scale(1)}
.tmr{display:flex;align-items:center;gap:14px;margin:10px 0}
.step{cursor:pointer;transition:.3s}.step.ok{border-color:var(--gold);background:var(--golds)}.step.ok i{background:var(--gold);color:#000}
.pyr{max-width:340px;margin:14px auto}.tier{height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card2);margin-bottom:4px;padding:0 15%;transition:background .6s}.tier.f{background:var(--golds)}.tier.cur{background:color-mix(in srgb,var(--gold) 24%,var(--card2))}.tier b{font-family:var(--serif);font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}.tier span{font-size:11px;color:var(--mute);line-height:1.3}
.st p{margin:0;font-size:13.5px}.card .st{margin-bottom:8px}
</style>

<script>
var D={"id":"bloody","nombre":"Warhola Gin","sub":"Edición Bloody","tagline":"A Bloody Mary, Distilled · Gin de Autor","accentColor":"#8f171d","intro":"Tenés en tus manos la Edición Bloody de Warhola Gin. Un destilado de autor que rompe convenciones: capas, matices y acordes que vas a descubrir de a uno con tu nariz y tu paladar. La receta completa y la leyenda detrás de la etiqueta se revelan al final de la cata.","ritual":[["La copa Sphere","Servilo en copa Sphere: un globo amplio sin tallo para concentrar el mapa aromático."],["El hielo macizo","Hielo abundante, cristalino y macizo para enfriar en segundos sin diluir el destilado."],["El giro continuo","Dos giros suaves para oxigenar el gin y activar los aceites botánicos en las paredes del cristal."]],"capas":[{"k":"Base","t":"La base olfativa","s":"olfato","teach":"Esto se huele. Las moléculas aromáticas viajan por la nariz, no por la boca.","tip":"Acercá la nariz al borde de la copa, labios apenas abiertos, y respirá corto tres veces.","q":"¿Qué aroma aparece primero?","o":[{"l":"Bosque y resina","a":"Como una ramita de pino o el aire de bosque tras la lluvia.","q":"¿Más a pino fresco o a hierba aromática de cocina?","b":[{"l":"Pino fresco","a":"Madera verde, fresca y resinosa.","hit":true,"n":"Enebro alpino","f":"Esa nota resinosa es el enebro silvestre, la baya sagrada que define a todo gin auténtico. Ya tenés la primera capa en foco."},{"l":"Hierba de cocina","a":"Tomillo, romero, orégano seco.","hit":false,"f":"Es una pista muy cercana. Volvé a oler buscando algo más de bosque vivo y corteza que de alacena: ese es el enebro."}]},{"l":"Cítrico seco","a":"Cáscara rallada de limón o pomelo, no su zumo líquido.","q":"¿Cáscara fresca oleosa o semilla seca especiada?","b":[{"l":"Semilla especiada","a":"Cítrica, tostada, un poco anisada.","hit":true,"n":"Coriandro tostado","f":"¡Exacto! Es el coriandro. La semilla tostada aporta ese perfil cítrico y seco que no proviene de frutas ácidas."},{"l":"Cáscara fresca ol é le pasa a tu saliva?","q":"¿Qué sentís físicamente en la boca?","o":[{"l":"Salivación instantánea","a":"Como al saborear un caldo concentrado, parmesano curado o salmuera.","q":"¿Es salado concentrado o umami profundo y redondeado?","b":[{"l":"Salado concentrado","a":"Como una aceituna o una alcaparra.","hit":true,"n":"Tomate seco y alcaparra","f":"¡Brillante! Salinidad botánica concentrada: tomate seco liofilizado y alcaparras, que actúan en la lengua y no en la nariz."},{"l":"Umami profundo y redondo","a":"Sabroso, largo, envolvente, sin aristas.","hit":true,"n":"Salsa inglesa artesanal","f":"Ese es el umami en estado puro. En Edición Bloody lo aporta una maceración sutil de salsa inglesa tradicional."}]},{"l":"Calor tibio y humo suave","a":"Pimiento asado a la brasa. No es picante agresivo.","q":"¿Ardor punzante o un cosquilleo templado que sube despacio?","b":[{"l":"Cosquilleo templado","a":"Calor amable en el pecho tras tragar.","hit":true,"n":"Jalapeño ahumado","f":"Ese calor amable con rastro de leña es el jalapeño deshidratado en horno de brasas. Da longitud sin tapar los botánicos."},{"l":"Ardor punzante","a":"Pica en la punta de la lengua.","hit":false,"f":"En Warhola Gin el jalapeño es noble y templado. Buscá un calor reconfortante en retrogusto, nunca un picor abrasivo."}]},{"l":"Textura sedosa","a":"Untuoso, envolvente, casi aterciopelado, sin golpe alcohólico.","q":"¿Es una sensación aceitosa pesada o un terciopelo limpio?","b":[{"l":"Terciopelo limpio","a":"Cuerpo suave que acaricia el paladar.","hit":true,"n":"Base de vodka de papa artesanal","f":"Esa sedosidad es el secreto maestro: nuestra base de vodka de papa fermentada y destilada en casa. Textura táctil antes que sabor."},{"l":"Aceitosa pesada","a":"Sensación grasa en el paladar.","hit":false,"f":"Casi. Buscá la caricia limpia y sedosa que arropa la lengua sin dejar película grasa: es la base pura de papa artesanal."}]}]}],"tonica":[{"k":"Salida","t":"Salida: moléculas volátiles","s":"olfato"
